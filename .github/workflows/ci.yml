name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "25.1.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
