name: GitHub compatibility

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}
defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: muleyuck/github-actions/actions/node/setup@v1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:compatibility
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: github-compatibility-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
